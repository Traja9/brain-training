name: Train Hybrid_LM

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy

      - name: Download dataset
        run: |
          curl -o dataset.txt "https://www.gutenberg.org/files/1342/1342-0.txt"
          echo "Dataset size: $(wc -c < dataset.txt) bytes"

      - name: Train Hybrid_LM
        run: python train_hybrid.py --file dataset.txt --chars 100000 --epochs 40

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: results/
